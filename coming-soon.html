<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即将上线 · BITFLUX</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0907" />
  <link rel="icon" type="image/png" href="assets/bitflux-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260707c" />
  <style>
    .cs-nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:18px 24px}
    .cs-nav img{height:28px;width:auto}
    .cs-nav .cs-actions{display:flex;align-items:center;gap:12px}
    .cs-wrap{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:120px 24px 80px;overflow:hidden}
    .cs-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
    .cs-inner{position:relative;z-index:2;max-width:640px}
    .cs-mark{width:74px;height:74px;border-radius:20px;border:1px solid var(--line-2);background:rgba(200,163,91,.06);display:grid;place-items:center;margin:0 auto 26px}
    .cs-mark img{width:42px;height:auto}
    .cs-badge{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);background:rgba(200,163,91,.08);border:1px solid var(--line-2);padding:7px 16px;border-radius:999px;margin-bottom:24px}
    .cs-badge .pill-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 0 4px rgba(234,217,168,.16);animation:pulse 2s infinite}
    .cs-title{font-family:'Space Grotesk','Noto Sans SC',sans-serif;font-weight:700;font-size:clamp(34px,6vw,60px);line-height:1.1;letter-spacing:-.02em;margin-bottom:18px}
    .cs-prod{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .cs-sub{font-size:clamp(15px,1.8vw,18px);color:var(--txt-mut);margin-bottom:34px}
    .cs-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
    .cs-meta{font-size:13px;color:var(--txt-dim)}
    .cs-progress{max-width:340px;margin:0 auto 30px}
    .cs-progress .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
    .cs-progress .bar i{display:block;height:100%;width:72%;background:var(--gold-grad);border-radius:999px;animation:grow 1.4s var(--ease) both}
    .cs-progress span{display:block;margin-top:10px;font-size:12px;color:var(--txt-dim)}
    @keyframes grow{from{width:0}to{width:72%}}
  </style>
</head>
<body>
  <header class="cs-nav">
    <a href="index.html" aria-label="BITFLUX home"><img src="assets/bitflux-logo.png" alt="BITFLUX" /></a>
    <div class="cs-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
      <a class="btn btn-ghost" href="index.html" id="backBtn">返回首页</a>
    </div>
  </header>

  <main class="cs-wrap">
    <div class="cs-bg" aria-hidden="true">
      <div class="glow glow-1"></div><div class="glow glow-2"></div><div class="glow glow-3"></div>
      <div class="grid-lines"></div>
    </div>
    <div class="cs-inner">
      <div class="cs-mark"><img src="assets/bitflux-icon.png" alt="" /></div>
      <span class="cs-badge"><span class="pill-dot"></span><span id="badge">敬请期待</span></span>
      <h1 class="cs-title"><span class="cs-prod" id="prod">BITFLUX</span><br /><span id="soonText">即将上线</span></h1>
      <p class="cs-sub" id="sub">我们正在全力打造这项功能。在 Twitter 关注我们，第一时间获取上线通知与抢先体验资格。</p>
      <div class="cs-progress" aria-hidden="true"><div class="bar"><i></i></div><span id="prog">开发进度 · 72%</span></div>
      <div class="cs-cta">
        <a class="btn btn-primary btn-lg" href="https://x.com/bitfluxcard" target="_blank" rel="noopener" id="cta1">在 Twitter 获取通知</a>
        <a class="btn btn-ghost btn-lg" href="index.html" id="cta2">返回首页</a>
      </div>
      <p class="cs-meta" id="meta">已上线：多币种钱包 · 外汇兑换 · BF Card · 全球提现</p>
    </div>
  </main>

  <script>
    (function () {
      var T = {
        zh: { back: '返回首页', badge: '敬请期待', soon: '即将上线', sub: '我们正在全力打造这项功能。在 Twitter 关注我们，第一时间获取上线通知与抢先体验资格。', cta1: '在 Twitter 获取通知', cta2: '返回首页', prog: '开发进度 · 72%', meta: '已上线：多币种钱包 · 外汇兑换 · BF Card · 全球提现' },
        en: { back: 'Back to home', badge: 'Coming soon', soon: 'is coming soon', sub: 'We\u2019re building this feature right now. Follow us on Twitter to get launch updates and early access first.', cta1: 'Get notified on Twitter', cta2: 'Back to home', prog: 'In development · 72%', meta: 'Live now: Wallet · Swap · BF Card · Global withdrawal' }
      };
      function qs(n){ try { return new URLSearchParams(location.search).get(n); } catch(e){ return null; } }
      var prod = (qs('p') || 'BITFLUX').toString().slice(0, 40);
      var lang;
      try { lang = localStorage.getItem('bitflux_lang'); } catch(e){}
      if (lang !== 'zh' && lang !== 'en') lang = 'en';
      function apply(l){
        var d = T[l];
        document.documentElement.lang = (l === 'zh') ? 'zh-CN' : 'en';
        document.getElementById('prod').textContent = prod;
        document.getElementById('badge').textContent = d.badge;
        document.getElementById('soonText').textContent = (l === 'zh') ? d.soon : d.soon;
        document.getElementById('sub').textContent = d.sub;
        document.getElementById('cta1').textContent = d.cta1;
        document.getElementById('cta2').textContent = d.cta2;
        document.getElementById('backBtn').textContent = d.back;
        document.getElementById('prog').textContent = d.prog;
        document.getElementById('meta').textContent = d.meta;
        var t = document.getElementById('langToggle');
        if (t) t.textContent = (l === 'zh') ? 'EN' : '中文';
        try { localStorage.setItem('bitflux_lang', l); } catch(e){}
        lang = l;
      }
      var toggle = document.getElementById('langToggle');
      if (toggle) toggle.addEventListener('click', function(){ apply(lang === 'zh' ? 'en' : 'zh'); });
      apply(lang);
    })();
  </script>
</body>
</html>
